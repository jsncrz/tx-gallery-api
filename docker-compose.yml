services:
  tx-gallery-api:
    build: .
    image: "tx-gallery-api"
    user: "node"
    working_dir: /usr/src/tx-gallery-api
    volumes:
      - ./:/usr/src/tx-gallery-api
    expose: 
      - 3000
    ports:
      - "3000:3000"
    networks:
      - node-network
  
networks:
  node-network:
    driver: bridge

