services:
  tx-gallery-api:
    container_name: tx-api-dev
    command: npm run start:build --env=development
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/tx-gallery
    

  mongodb:
    image: mongo
    ports:
      - '27017:27017'
    volumes:
      - dbdata:/data/db
    networks:
      - node-network
volumes:
  dbdata: